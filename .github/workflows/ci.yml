# Corre en cada pull request: compila, tests unitarios y lint de Android.
# Si falla, el pull request no se une a main (configurarlo en la protección de main en GitHub).
# Los tests de Room (androidTest) necesitan emulador: se corren a mano antes de abrir el pull request.
name: CI
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Reglas del grupo
        run: bash scripts/reglas.sh
